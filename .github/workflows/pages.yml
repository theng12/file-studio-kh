# Publishes docs/ (the appcast and its proofs) to GitHub Pages. Keyless: it only uploads the
# committed static files — it never builds, signs or touches the EdDSA key (RELEASE-POLICY §2c:
# "Actions can run tests and checks; it cannot sign"). The appcast is written and signed locally
# from the published DMG before this runs.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
